/* storage: shared artifact storage when available, otherwise the browser */
/*
  SYNC — how every phone sees the same kitchen.
  A static site has no memory of its own, so the kitchen lives at one shared web address.
  Either paste that address here (it then ships inside the file to every device):
*/
const SYNC_URL = "";   // e.g. "https://YOUR-PROJECT-default-rtdb.firebaseio.com/kitchen-secret-word.json"
/*
  …or leave it empty and use the "kitchen code" on the login screen: Mayu taps "create a kitchen code",
  the site makes a private shared record, and everyone enters that code once on their own device.
*/
const codeToUrl = (code) => {
  const c = (code || "").trim();
  if (!c) return "";
  if (/^https?:\/\//i.test(c)) return c;
  return `https://jsonblob.com/api/jsonBlob/${c}`;
};
const getKitchenCode = () => { try { return window.localStorage.getItem("bistro-kitchen-code") || ""; } catch { return ""; } };
const setKitchenCode = (c) => { try { c ? window.localStorage.setItem("bistro-kitchen-code", c.trim()) : window.localStorage.removeItem("bistro-kitchen-code"); } catch {} };
const syncUrl = () => SYNC_URL || codeToUrl(getKitchenCode());
const createKitchenCode = async (initial) => {
  const r = await fetch("https://jsonblob.com/api/jsonBlob", { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(initial) });
  if (!r.ok) throw new Error("could not create");
  let loc = r.headers.get("Location") || r.headers.get("location") || "";
  let id = loc.split("/").pop();
  if (!id) {                                    // some browsers hide the header; the response URL sometimes carries it
    const u = r.url || ""; const m = u.match(/jsonBlob\/([a-f0-9-]{20,})/i); if (m) id = m[1];
  }
  if (!id) throw new Error("no id");
  /* prove it exists before handing the code out */
  const chk = await fetch(codeToUrl(id), { cache: "no-store", headers: { Accept: "application/json" } });
  if (!chk.ok) throw new Error("created but unreadable");
  return id;
};

/* what the pipe is doing, so problems are visible instead of silent */
const SYNC = { getAt: 0, getOk: null, getStatus: "", putAt: 0, putOk: null, putStatus: "", error: "", remoteRequests: null, pending: 0 };
const noteErr = (e) => { SYNC.error = e && e.message ? e.message : String(e); };
const store = {
  get: async () => {
    try {
      if (DEMO) return window.localStorage.getItem(KEY + ":demo");
      const url = syncUrl();
      if (url) {
        let r;
        const bust = url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
        try { r = await fetch(bust, { cache: "no-store", headers: { Accept: "application/json", "Cache-Control": "no-cache" } }); }
        catch (e) { SYNC.getAt = Date.now(); SYNC.getOk = false; SYNC.getStatus = "network"; noteErr("Couldn't reach the sync address at all (network or CORS)."); return null; }
        SYNC.getAt = Date.now(); SYNC.getOk = r.ok; SYNC.getStatus = String(r.status);
        if (!r.ok) { noteErr(r.status === 404 ? "This kitchen code doesn't exist — check it letter for letter, or create a new one." : `Read failed with HTTP ${r.status}.`); return null; }
        const j = await r.json();
        SYNC.error = ""; SYNC.remoteRequests = j && Array.isArray(j.requests) ? j.requests.filter((x) => !x.done).length : 0;
        return j && typeof j === "object" && Object.keys(j).length ? JSON.stringify(j) : null;
      }
      if (window.storage) { const r = await window.storage.get(KEY, true); return r ? r.value : null; }
      return window.localStorage.getItem(KEY);
    } catch (e) { noteErr(e); return null; }
  },
  set: async (v) => {
    try {
      if (DEMO) { window.localStorage.setItem(KEY + ":demo", v); return true; }
      const url = syncUrl();
      if (url) {
        let r;
        SYNC.pending += 1;
        try { r = await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: v }); }
        catch (e) { SYNC.pending -= 1; SYNC.putAt = Date.now(); SYNC.putOk = false; SYNC.putStatus = "network"; noteErr("Couldn't send to the sync address (network or CORS)."); return false; }
        SYNC.pending -= 1; SYNC.putAt = Date.now(); SYNC.putOk = r.ok; SYNC.putStatus = String(r.status);
        if (!r.ok) noteErr(`Save failed with HTTP ${r.status}.`); else SYNC.error = "";
        return r.ok;
      }
      if (window.storage) await window.storage.set(KEY, v, true);
      else window.localStorage.setItem(KEY, v);
      return true;
    } catch (e) { noteErr(e); return false; }
  },
  /* writes the record back with a stamp, reads it again, and checks the stamp survived the round trip */
  test: async () => {
    const url = syncUrl(); if (!url) return { ok: false, why: "No kitchen code on this device." };
    try {
      const r1 = await fetch(url, { cache: "no-store", headers: { Accept: "application/json" } });
      if (!r1.ok) return { ok: false, why: r1.status === 404 ? "Code not found (404). It was mistyped, or the record has expired." : `Read failed: HTTP ${r1.status}` };
      const cur = await r1.json(); const stamp = "t" + Date.now();
      const r2 = await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ ...(cur || {}), _probe: stamp }) });
      if (!r2.ok) return { ok: false, why: `Write failed: HTTP ${r2.status}. Reading works but saving doesn't.` };
      const r3 = await fetch(url, { cache: "no-store", headers: { Accept: "application/json" } });
      const back = await r3.json();
      return back && back._probe === stamp ? { ok: true, why: `Round trip fine. ${(back.requests || []).filter((x) => !x.done).length} open order(s) in the shared record.` } : { ok: false, why: "Wrote fine but read back stale data — the service is caching. Try again in a moment." };
    } catch (e) { return { ok: false, why: "Blocked before it got anywhere — the browser refused the request (network, or CORS on the service)." }; }
  },
  synced: () => DEMO ? false : !!syncUrl(),
  login: async () => null,
  logout: () => {},
};

/* union two id-keyed lists; when both hold an id, the later `updatedAt` wins */
const mergeById = (local = [], remote = []) => {
  const m = new Map();
  remote.forEach((x) => x && x.id && m.set(x.id, x));
  local.forEach((x) => { if (!x || !x.id) return; const r = m.get(x.id); if (!r || (x.updatedAt || 0) >= (r.updatedAt || 0)) m.set(x.id, x); });
  return [...m.values()];
};
/* fold a remote snapshot into local state. Mayu owns the kitchen; everyone shares the mail, the list and the drawings. */
const mergeData = (local, remote, who) => {
  if (!remote) return local;
  const shared = {
    requests: mergeById(local.requests, remote.requests),
    cravings: mergeById(local.cravings, remote.cravings),
    history: mergeById(local.history, remote.history),
    grocery: mergeById(local.grocery, remote.grocery),
    sketchMayu: (remote.sketchMayu && (remote.sketchMayu.at || 0) > ((local.sketchMayu && local.sketchMayu.at) || 0)) ? remote.sketchMayu : local.sketchMayu,
    sketchBran: (remote.sketchBran && (remote.sketchBran.at || 0) > ((local.sketchBran && local.sketchBran.at) || 0)) ? remote.sketchBran : local.sketchBran,
    catTreat: !!(local.catTreat || remote.catTreat), dogTreat: !!(local.dogTreat || remote.dogTreat),
    dogTreats: [...new Set([...(local.dogTreats || []), ...(remote.dogTreats || [])])],
  };
  if (who === "mayu") return { ...local, ...shared };
  const { requests, cravings, history, grocery, sketchMayu, sketchBran, catTreat, dogTreat, dogTreats, ...kitchen } = remote;
  return { ...local, ...kitchen, ...shared };
};

const norm = (s) => String(s || "").toLowerCase().trim().replace(/(es|s)$/, "");
const findItem = (name, inv) => {
  const n = norm(name); if (!n) return null;
  return inv.find((i) => { const m = norm(i.name); return m === n || (n.length > 3 && m.includes(n)) || (m.length > 3 && n.includes(m)); });
};
const recipeState = (r, inv) => {
  const missing = r.ingredients.filter((g) => { const h = findItem(g.name, inv); return !h || Number(h.qty) <= 0; }).map((g) => g.name);
  return { missing, level: missing.length === 0 ? "ready" : missing.length <= 2 ? "shop" : "ahead" };
};
const SHOP_LEAD = 120, ICED_LEAD = 120;
const MILKS = ["Whole milk", "Oat milk", "Almond milk", "Soy milk"];
const mins = (m) => (m >= 90 ? `${Math.floor(m / 60)} hr${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`);
const clock = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const styleLabel = { casual: "Casual", homey: "Homey", refined: "Refined" };
function dishExtras(it, r) {
  if (!r || !r.options || !it.opts) return { extra: 0, names: [] };
  let extra = 0; const names = [];
  r.options.forEach((grp) => {
    (it.opts[grp.id] || []).forEach((cid) => {
      const c = grp.choices.find((x) => x.id === cid);
      if (c) { extra += Number(c.extra) || 0; names.push(c.name); }
    });
  });
  return { extra, names };
}
function itemMinutes(it, data) {
  if (it.type === "dish") {
    const r = data.recipes.find((x) => x.id === it.id);
    return Math.round(((r?.minutes || 0) + dishExtras(it, r).extra) * (1 + 0.35 * ((it.qty || 1) - 1)));
  }
  const d = data.drinks.find((x) => x.id === it.id); if (!d) return 0;
  return d.prep + (it.opts?.temp === "iced" && d.kind === "tea" ? ICED_LEAD : 0) + (it.opts?.temp === "hot" && d.kind === "cold" ? 3 : 0);
}
function cartTotals(cart, data) {
  const cookSum = cart.reduce((n, it) => n + itemMinutes(it, data), 0);
  const handling = cart.reduce((n, it) => n + (it.qty || 1), 0);
  let shop = 0;
  cart.forEach((it) => {
    if (it.type !== "dish") return;
    const r = data.recipes.find((x) => x.id === it.id);
    if (r && recipeState(r, data.inventory).missing.length) shop = SHOP_LEAD;
  });
  const total = cookSum + handling + shop;
  return { cookSum, handling, shop, total, at: new Date(Date.now() + total * 60000) };
}
const describeOpts = (o, d) => {
  if (!o) return "";
  const b = [];
  if (o.temp === "iced") b.push(d?.kind === "tea" ? "iced" : "over ice");
  if (o.temp === "hot") b.push("hot");
  if (o.sweet && o.sweet !== "none") b.push(o.sweet);
  if (o.milk && o.milk !== "none") b.push(o.froth ? `${o.milk.toLowerCase()}, frothed` : o.milk.toLowerCase());
  return b.join(" · ");
};

  const bark = useCallback(() => {
    unlock();
    const ctx = ctxRef.current; if (!ctx) return;
    const t = ctx.currentTime, dur = 0.16;
    /* a small, round puppy "yip" — high, soft, quick */
    const out = ctx.createGain(); out.connect(ctx.destination);
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.2, t + 0.015); out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(900, t + dur); lp.connect(out);
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(760, t + 0.04); o.frequency.exponentialRampToValueAtTime(380, t + dur);
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.setValueAtTime(1040, t); o2.frequency.exponentialRampToValueAtTime(760, t + dur); const g2 = ctx.createGain(); g2.gain.value = 0.3;
    o.connect(lp); o2.connect(g2); g2.connect(lp); o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
  }, [unlock]);
  const happy = useCallback(() => { strike(660, 0.08, 0.5); }, [strike]);
  const lever = useCallback(() => {
    unlock(); const ctx = ctxRef.current; if (!ctx) return;
    const t = ctx.currentTime;
    const n = ctx.createBufferSource(); const buf = ctx.createBuffer(1, 4400, ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2) * (i < 900 ? 1 : 0.35);
    n.buffer = buf; const g = ctx.createGain(); g.gain.value = 0.25;
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 1.6;
    n.connect(bp); bp.connect(g); g.connect(ctx.destination); n.start(t);
    const o = ctx.createOscillator(); o.type = "square"; o.frequency.setValueAtTime(180, t + 0.08); o.frequency.exponentialRampToValueAtTime(90, t + 0.22);
    const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t + 0.08); og.gain.exponentialRampToValueAtTime(0.12, t + 0.1); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(og); og.connect(ctx.destination); o.start(t + 0.08); o.stop(t + 0.26);
  }, [unlock]);
  return { bell, ping, purr, meow, bark, happy, lever, unlock };
}

const UNITS = "g|kg|ml|l|oz|lb|lbs|tbsp|tsp|cup|cups|ea|pack|packs|bag|bags|box|boxes|jar|jars|bunch|bunches|head|heads|can|cans|bottle|bottles|tub|tubs|carton|cartons|punnet|slices|cloves|pint|pints|dozen";
const guessLoc = (n) => {
  const t = n.toLowerCase();
  if (/milk|cream|yogurt|yoghurt|cheese|butter|egg/.test(t)) return "fridge";
  if (/frozen|ice cream|popsicle|peas|dumpling|gyoza|pierog|meatball|ragu|stock cube|freezer|dough/.test(t)) return "freezer";
  if (/chip|crisp|cracker|cookie|biscuit|digestive|granola|pretzel|popcorn|almond|cashew|peanut|nuts|chocolate bar|candy|gummies|snack/.test(t)) return "snacks";
  if (/flour|rice|pasta|penne|spaghetti|noodle|oil|vinegar|salt|pepper|sugar|honey|syrup|spice|cumin|paprika|cinnamon|oregano|thyme|nutmeg|can |canned|beans|lentil|\boats?\b|cereal|passata|stock|broth|onion|garlic|potato|shallot|tea|coffee|wine|tahini|peanut butter|bread$/.test(t)) return "pantry";
  return "fridge";
};
const guessCat = (n, loc) => {

  if (/flour|rice|pasta|penne|noodle|oat|cereal|bread|lentil|beans|sugar/.test(t)) return "grain";
  if (/salt|pepper|cumin|paprika|cinnamon|oregano|thyme|nutmeg|spice|chilli|chili flakes/.test(t)) return "spice";
  if (/oil|vinegar|sauce|mustard|ketchup|mayo|passata|honey|syrup|jam|stock|broth|tallow|horseradish/.test(t)) return "sauce";
  if (loc === "freezer") return /meatball|ragu|dough|soup|stew|lasagna/.test(t) ? "homemade" : /gyoza|dumpling|pizza|nugget|fries/.test(t) ? "premade" : "frozen";

const parseQty = (line) => {

  if (!m) { const t = line.match(/^(.*?)\s*\((\d+)\)\s*$/); return t ? { qty: Number(t[2]), unit: "ea", name: t[1].trim() } : { qty: 1, unit: "ea", name: line.trim() }; }
  if (m.length === 3) return { qty: Number(m[2]), unit: "ea", name: m[1].trim() };
  return { qty: Number(String(m[1]).replace(",", ".")) || 1, unit: (m[2] || "ea").toLowerCase(), name: m[3].trim() };
};
const fallbackInventory = (text) => {
  let current = null;

    const tag = line.match(/^\s*(fridge|freezer|pantry|snacks?)\s*[:\-]\s*(.*)$/i);
    let lineLoc = current;
    if (tag) { const lc = tag[1].toLowerCase().startsWith("snack") ? "snacks" : tag[1].toLowerCase(); if (tag[2].trim()) { lineLoc = lc; line = tag[2]; } else { current = lc; return []; } }
    return line.split(",").map((l) => ({ l: l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "").trim(), loc: lineLoc }));
  }).filter(({ l }) => l.length > 1).map(({ l, loc }) => {
  const m = l.match(/^(a|an|some|one|two|three|half a|half an)\s+(?:(jar|bag|tub|box|bunch|carton|can|bottle|pack|head|punnet|loaf)\s+of\s+)?(.*)$/i);
  let q;
  if (m) { const words = { a: 1, an: 1, some: 1, one: 1, two: 2, three: 3, "half a": 1, "half an": 1 }; q = { qty: words[m[1].toLowerCase()] || 1, unit: m[2] ? m[2].toLowerCase() : "ea", name: (m[1].toLowerCase().startsWith("half") ? "Half a " : "") + m[3] }; }

const fallbackRecipe = (text) => {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const name = lines.shift() || "New dish";
  const ing = [], steps = [];
  lines.forEach((l) => {
    const numbered = /^\s*\d+[.)]\s+/.test(l);
    const clean = l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "");
    const verby = /^(sweat|add|cook|simmer|bake|stir|mix|fry|boil|whisk|fold|season|chop|slice|dice|heat|roast|serve|rest|drain|pour|melt|toast|sear|brown|reduce|blend|preheat|combine|let|leave|put|place|remove|bring|cover|grill|steam|marinate|knead|proof|score)\b/i.test(clean);
    const looksIng = !numbered && !verby && (new RegExp(`^(\\d|½|¼|¾|a |an |some |handful|pinch|(${UNITS})\\b)`, "i").test(clean) || (clean.split(" ").length <= 4 && !/[.!]$/.test(clean)));
    if (looksIng && steps.length === 0) { const q = parseQty(clean); ing.push({ qty: q.qty !== 1 || q.unit !== "ea" ? `${q.qty}${q.unit === "ea" ? "" : q.unit}` : "", name: q.name }); }

async function sortItForMe(kind, text) {
  const prompt = kind === "recipe"
    ? `Turn the following into strict JSON with keys: name (string), blurb (short lowercase ingredient list), style ("casual"|"homey"|"refined"), course ("main"|"soup"|"dessert"|"side"), minutes (number), ingredients (array of {qty:string,name:string}), steps (array of strings, one per step), notes (string). Respond with JSON only, no prose, no code fences.\n\n${text}`
    : `Sort the following kitchen inventory into a strict JSON array of {name:string, qty:number, unit:string, loc:"fridge"|"freezer"|"pantry"|"snacks", cat:"produce"|"dairy"|"meat"|"grain"|"spice"|"sauce"|"snack"|"frozen"|"premade"|"homemade", fresh:number (days it will keep)}. Put frozen things in the freezer, dry goods and spices in the pantry, crisps/biscuits/nuts in snacks, everything perishable in the fridge. Respond with JSON only, no prose, no code fences.\n\n${text}`;
  const body = JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1200, messages: [{ role: "user", content: prompt }] });
  try {
    if (!window.storage) throw new Error("no ai here");   // on a plain website there is no safe way to hold a key, so the built-in sorter does the work
    const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body });
    if (!r.ok) throw new Error("ai unavailable");
    const j = await r.json();
    const t = (j.content || []).map((c) => c.text || "").join("").replace(/```json|```/g, "").trim();
    const out = JSON.parse(t);
    if (kind === "recipe") return { ...out, ai: true };
    return { items: (Array.isArray(out) ? out : out.items || []).map((i) => ({ ...i, id: uid() })), ai: true };
  } catch {
    return kind === "recipe" ? { ...fallbackRecipe(text), ai: false } : { items: fallbackInventory(text), ai: false };
  }
}

function SortBox({ kind, onResult, placeholder }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const go = async () => {
    if (!text.trim()) return;
    setBusy(true); setNote("");
    const res = await sortItForMe(kind, text);
    setBusy(false);
    setNote(res.ai ? "Sorted." : "Sorted — have a quick look over it.");
    onResult(res); setText("");
  };
  return (
    <div style={{ background: C.parchWell, borderRadius: 10, padding: 14, display: "grid", gap: 10 }}>
      <Caps>Write it loosely, I'll sort it</Caps>
      <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder={placeholder}
        style={{ font: `16px/1.6 ${F}`, padding: 12, borderRadius: 8, border: `1px solid ${C.line}`, background: "#FFFDF8", color: C.ink, width: "100%", boxSizing: "border-box", minHeight: 110 }} />
      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
        <Btn small onClick={go} disabled={busy || !text.trim()}>{busy ? "Sorting…" : "Sort it"}</Btn>
        <span style={{ font: `italic 14px ${F}`, color: C.soft }}>{note}</span>
      </div>
    </div>
  );
}

function mix(hex, to, t) {
  const h = hex.replace("#", ""), k = to.replace("#", "");
  const a = [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)), b = [0, 2, 4].map((i) => parseInt(k.slice(i, i + 2), 16));
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function resolveEvent(ev) {
  if (!ev || !ev.preset || ev.preset === "none") return null;
  const base = EVENTS[ev.preset] || EVENTS.custom;
  const custom = ev.preset === "custom";
  const accent = custom ? ev.accent || base.accent : base.accent;
  const bg = custom ? ev.bg || base.bg : base.bg;
  return {
    preset: ev.preset,
    name: (ev.name || "").trim() || base.name,
    bg, accent,
    paper: custom ? mix(bg, "#FFFFFF", 0.7) : base.paper,
    alt: custom ? mix(accent, "#FFFFFF", 0.55) : base.alt,
    decor: custom ? ev.decor || base.decor : base.decor,
  };
}

      <path d="M0 -9 C6 -7 9 0 6 6 C3 3 1 6 0 9 C-1 6 -3 3 -6 6 C-9 0 -6 -7 0 -9 Z" fill={a || "#C97A2B"} /><path d="M0 -6 V6" strokeWidth="0.9" opacity="0.6" /></g>);

      if (kind2 === 1) return (<g transform={t}><circle cx="-5" cy="0" r="2.6" fill={c} /><rect x="1" y="-6" width="6" height="3" rx="1.5" fill={c2} transform="rotate(-30 4 -4.5)" /><circle cx="6" cy="4" r="1.8" fill={c} /></g>);

function DecorStrip({ decor, accent, width = 420 }) {
  if (!decor || decor === "none") return null;
  const n = decor === "confetti" ? 11 : 7, step = width / (n + 1);
  return (
    <svg viewBox={`0 0 ${width} 34`} width="100%" height="34" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style={{ display: "block" }}>
      {Array.from({ length: n }).map((_, i) => (
        <Motif key={i} kind={decor} x={step * (i + 1)} y={decor === "confetti" ? 17 : 17 + (i % 2 ? 3 : -3)} s={decor === "confetti" ? 1 : i % 3 === 1 ? 1.15 : 0.95}
          a={decor === "confetti" ? i : decor === "leaves" ? ["#C97A2B", "#A94B24", "#D9A62E"][i % 3] : decor === "eggs" ? ["#F2D6E4", "#D9E8F5", "#FBF0C4", "#D7EBD1"][i % 4] : decor === "hearts" ? [accent, "#F2B5BC", "#E28FA0"][i % 3] : undefined} />
      ))}
    </svg>
  );
}

function Bunting({ text, colors }) {
  const chars = [...(text || "")];
  const n = chars.length || 1;
  const W = 420, pad = 18, avail = W - pad * 2;
  const w = Math.min(30, avail / n), h = w * 1.3;
  const x0 = (W - w * n) / 2;
  const sag = (i) => Math.sin((i / Math.max(n - 1, 1)) * Math.PI) * 9;
  return (
    <svg viewBox={`0 0 ${W} ${h + 34}`} width="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style={{ display: "block" }}>
      <path d={`M0 10 Q ${W / 2} 30 ${W} 10`} stroke={OUT} strokeWidth="1.6" fill="none" />
      {chars.map((ch, i) => {
        if (ch === " ") return null;
        const x = x0 + i * w, y = 10 + sag(i) + (i / Math.max(n - 1, 1) - 0.5) ** 2 * 0 + 4;
        const yTop = 10 + 20 * (1 - Math.abs((i + 0.5) / n - 0.5) * 2) * 0.5;
        const col = colors[i % colors.length];
        return (
          <g key={i}>
            <path d={`M${x} ${yTop} L${x + w} ${yTop} L${x + w / 2} ${yTop + h} Z`} fill={col} stroke={OUT} strokeWidth="1.3" strokeLinejoin="round" />
            <path d={`M${x + 3} ${yTop + 2} L${x + w / 2} ${yTop + h - 5}`} stroke="#FFFFFF" strokeWidth="1.1" opacity="0.35" />
            <text x={x + w / 2} y={yTop + h * 0.52} textAnchor="middle" fill="#FFFDF6" stroke={OUT} strokeWidth="0.35" style={{ font: `600 ${w * 0.62}px ${F}` }}>{ch.toUpperCase()}</text>
          </g>
        );
      })}
    </svg>
  );
}

function Confetti({ colors, count = 26 }) {
  const pieces = useMemo(() => Array.from({ length: count }).map((_, i) => {
    const r = (k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
    return { left: r(1) * 100, top: r(2) * 100, rot: r(3) * 360, w: 4 + r(4) * 5, h: 2 + r(5) * 2, dot: r(6) > 0.6, col: colors[i % colors.length] };
  }), [count, colors.join()]);
  return (
    <div aria-hidden="true" style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "hidden" }}>
      {pieces.map((pc, i) => (
        <span key={i} style={{ position: "absolute", left: `${pc.left}%`, top: `${pc.top}%`, width: pc.dot ? pc.h + 2 : pc.w, height: pc.dot ? pc.h + 2 : pc.h, borderRadius: pc.dot ? "50%" : 1.5, background: pc.col, transform: `rotate(${pc.rot}deg)`, opacity: 0.85 }} />
      ))}
    </div>
  );
}

function EventBanner({ ev }) {

    const txt = (t ?? text).trim(); if (!txt) return;

  const save = (id) => { set((g) => g.map((x) => (x.id === id ? { ...x, text: text.trim() || x.text, note: note.trim(), updatedAt: Date.now() } : x))); setEditId(null); setText(""); setNote(""); };
  const startEdit = (i) => { setEditId(i.id); setText(i.text); setNote(i.note || ""); setAdding(true); };
  const isCatFood = (t) => /cat\s*(food|treat|kibble|biscuit)|kibble|catnip/i.test(t || "");
  const isDogFood = (t) => /dog\s*(food|kibble|chow)|puppy\s*(food|chow)/i.test(t || "");
  const dogTreatFor = (t) => { const m = (t || "").match(/treats?\s+for\s+([a-z][\w'-]*)/i); if (m) return m[1]; return /dog\s*(treat|biscuit|cookie|bone)s?/i.test(t || "") ? "*" : null; };
  const toggle = (i) => update((p) => {
    const grocery = (p.grocery || []).map((x) => (x.id === i.id ? { ...x, got: x.got ? (x.got === who || isMayu ? null : x.got) : who, updatedAt: Date.now() } : x));
    const nowGot = grocery.find((x) => x.id === i.id)?.got;
    const tf = nowGot ? dogTreatFor(i.text) : null;
    return { ...p, grocery, catTreat: p.catTreat || (!!nowGot && isCatFood(i.text)), dogTreat: p.dogTreat || (!!nowGot && isDogFood(i.text)), dogTreats: tf ? [...(p.dogTreats || []), tf] : (p.dogTreats || []) };
  });
  const canRemove = (i) => isMayu || i.addedBy === who;
  const done = list.length > 0 && list.every((i) => i.got);

  return (
    <div>
      <div style={{ ...paper, padding: "18px 16px 18px 54px", minHeight: 200 }}>
        <Margin /><Punches />
        <div style={{ display: "flex", alignItems: "baseline", height: 30 }}>
          <div style={{ flex: 1, font: `400 24px/30px ${F}`, color: C.ink, letterSpacing: "0.01em" }}>Grocery list</div>
          {done && <span style={{ font: `italic 14px ${F}`, color: C.sageDeep, marginRight: 8 }}>all bought</span>}
          {!isMayu && !adding && (
            <button onClick={() => setAdding(true)} style={{ font: `500 13px ${F}`, letterSpacing: "0.08em", color: C.soft, background: "transparent", border: `1px solid ${C.line}`, borderRadius: 999, padding: "2px 9px", cursor: "pointer" }}>add</button>
          )}
        </div>
        {list.length === 0 && <div style={{ font: `italic 17px/30px ${F}`, color: C.soft }}>Nothing on it yet.</div>}
        {list.map((i) => (
          <div key={i.id} style={{ position: "relative", display: "flex", alignItems: "center", gap: 8, height: 30, lineHeight: "30px" }}>
            <Check who={i.got} onClick={() => toggle(i)} disabled={i.got && i.got !== who && !isMayu} />
            <span style={{ flex: 1, font: `17px ${F}`, color: i.got ? C.soft : C.ink, textDecoration: i.got ? "line-through" : "none", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{i.text}</span>
            {i.note ? (
              <span style={{ position: "relative", flexShrink: 0, width: 19, height: 19 }}
                onMouseEnter={() => setInfo(i.id)} onMouseLeave={() => setInfo(null)}>
                {incoming(i) && <>
                  <Sparkle style={{ left: -7, top: -6 }} />
                  <Sparkle style={{ right: -7, top: -3, transform: "scale(.8)" }} />
                  <Sparkle style={{ left: -4, bottom: -7, transform: "scale(.7)" }} />
                </>}
                <button onClick={() => setInfo(info === i.id ? null : i.id)} aria-label="Why this is needed"
                  style={{ width: 19, height: 19, borderRadius: 10,
                    border: `1.2px solid ${incoming(i) ? "#B88A1F" : info === i.id ? C.soft : "#C7B7A6"}`,
                    background: incoming(i) ? "#F6D877" : "transparent",
                    color: incoming(i) ? "#5A430C" : info === i.id ? C.ink : "#B9A895",
                    font: `italic 500 13px ${F}`, cursor: "pointer", padding: 0, lineHeight: 1 }}>i</button>
                {info === i.id && (
                  <span style={{ position: "absolute", right: 0, top: 24, zIndex: 30, background: C.ink, color: C.parch, font: `15px/1.4 ${F}`, padding: "8px 11px", borderRadius: 7, width: 190, boxShadow: "0 8px 18px rgba(0,0,0,0.25)" }}>{i.note}</span>
                )}
              </span>
            ) : <span style={{ width: 19, flexShrink: 0 }} />}
            {isMayu && <button onClick={() => startEdit(i)} style={{ background: "none", border: "none", color: C.soft, font: `italic 15px ${F}`, cursor: "pointer", padding: "0 2px" }}>✎</button>}
            {canRemove(i) && <button onClick={() => set((g) => g.map((x) => (x.id === i.id ? { ...x, removed: true, updatedAt: Date.now() } : x)))} style={{ background: "none", border: "none", color: C.soft, font: `16px ${F}`, cursor: "pointer", padding: "0 2px" }}>×</button>}
          </div>
        ))}
        {suggestions.length > 0 && (
          <>
            <div style={{ font: `italic 15px/30px ${F}`, color: C.soft, marginTop: 4 }}>For what you asked for today</div>
            {suggestions.map((sg) => (
              <div key={sg.text} style={{ display: "flex", alignItems: "center", gap: 8, height: 30, lineHeight: "30px" }}>
                <button onClick={() => add(sg.text, `For the ${sg.recipe.name.toLowerCase()}`, sg.recipe.id)} aria-label="Add to list"
                  style={{ width: 18, height: 18, borderRadius: 9, border: `1.4px solid #B88A1F`, background: "#F6D877", color: "#5A430C", font: `600 14px ${F}`, lineHeight: 1, cursor: "pointer", padding: 0, flexShrink: 0 }}>+</button>
                <span style={{ flex: 1, font: `italic 17px ${F}`, color: C.soft }}>{sg.text}</span>
                <span style={{ font: `14px ${F}`, color: "#B9A895" }}>{sg.recipe.name}</span>
              </div>
            ))}
          </>
        )}
      </div>

      {(isMayu || adding) && (
        <div style={{ marginTop: 12, display: "grid", gap: 8 }}>
          <Field placeholder={editId ? "Item" : "Add an item"} value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && (editId ? save(editId) : add())} />
          {isMayu && <Field placeholder="What it's for (optional — shows as an info note)" value={note} onChange={(e) => setNote(e.target.value)} />}
          <div style={{ display: "flex", gap: 8 }}>
            {editId ? <>
              <Btn small onClick={() => save(editId)}>Save</Btn>
              <Btn small tone="ghost" onClick={() => { setEditId(null); setText(""); setNote(""); setAdding(false); }}>Cancel</Btn>
            </> : <>
              <Btn small onClick={() => add()} disabled={!text.trim()}>Add to list</Btn>
              {!isMayu && <Btn small tone="ghost" onClick={() => { setAdding(false); setText(""); }}>Cancel</Btn>}
            </>}
            {isMayu && list.some((i) => i.got) && <Btn small tone="ghost" onClick={() => set((g) => g.map((x) => (x.got ? { ...x, removed: true, updatedAt: Date.now() } : x)))} style={{ marginLeft: "auto", color: C.soft }}>Clear ticked</Btn>}
          </div>
        </div>
      )}
    </div>
  );
}

};
const petPalette = (a) => (a.kind === "dog" ? DOG_BREEDS[a.breed] || DOG_BREEDS.golden : CAT_BREEDS[a.breed] || CAT_BREEDS["grey-tabby"]);
const seededRand = (seed) => { let h = 0; for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; }; };
/* a random scatter of spots for calico and merle coats, fixed per animal so it never flickers */
const coatSpots = (id, n, box, palette) => {
  const r = seededRand(id);
  return Array.from({ length: n }).map(() => ({ x: box.x + r() * box.w, y: box.y + r() * box.h, rx: 4 + r() * 8, ry: 3 + r() * 7, rot: r() * 180, col: palette[Math.floor(r() * palette.length)], o: 0.75 + r() * 0.25 }));
};

          <ellipse cx="57.5" cy="51.5" rx="6" ry="4" fill={p.white ? "#FFFFFF" : mix(p.base[0], "#FFFFFF", 0.35)} stroke="none" />

          <path d="M52 52 v2.5 M52 54.5 q-3.5 3 -6.5 0.8 M52 54.5 q3.5 3 6.5 0.8" strokeWidth="1.3" />

        </g>
        {holding === "ball" && <g transform="translate(52 58)"><circle r="7.5" fill="#F2C94C" strokeWidth="1.5" /><circle cx="-2.6" cy="-2.6" r="1.7" fill="#FCEBAA" stroke="none" /></g>}
        {holding === "bag" && <g transform="translate(52 66) rotate(-8)"><CatFoodBag scale={0.9} /></g>}

          <ellipse cx="40" cy="96" rx="8.5" ry="4.6" fill={p.points ? p.points : belly} />
          <path d="M35 95 v3 M40 94.5 v3.5 M45 95 v3" strokeWidth="0.9" opacity="0.45" />
        </g>
      </g>
    </>
  );
}

  const fur = `url(#${g}fur)`;

  return (
    <>
      <defs>

        <radialGradient id={g + "sh"}><stop offset="0" stopColor="#3A2214" stopOpacity="0.24" /><stop offset="1" stopColor="#3A2214" stopOpacity="0" /></radialGradient>
      </defs>
      <ellipse cx="52" cy="99" rx={32 + lw} ry="5" fill={`url(#${g}sh)`} />
      <g stroke={OUT} strokeLinejoin="round" strokeLinecap="round" fill="none" strokeWidth="1.7">

        {p.white && <path d={`M52 68 C64 68 70 78 69 87 C68 94 61 97 52 97 C43 97 36 94 35 87 C34 78 40 68 52 68 Z`} fill="#FFFFFF" stroke="none" />}

          {p.curly && <path d="M34 24 q5 -6 10 0 q5 -6 10 0 q5 -6 10 0 q5 -6 10 0" strokeWidth="1.3" opacity="0.4" />}
          {/* muzzle */}

          {/* eyes */}

          <circle cx="44" cy="38" r="1.6" fill="#fff" stroke="none" /><circle cx="64" cy="38" r="1.6" fill="#fff" stroke="none" />
          <g className="bb-blink" style={{ transformOrigin: "center" }}>
            <ellipse cx="42" cy="40" rx="6.2" ry="6.6" fill={p.base[1]} stroke="none" /><ellipse cx="62" cy="40" rx="6.2" ry="6.6" fill={p.base[1]} stroke="none" />

          {/* nose and mouth */}
          <path d="M52 47 C48.5 47 46.5 49.5 47.5 51.5 C48.5 53.5 51 54.5 52 55.5 C53 54.5 55.5 53.5 56.5 51.5 C57.5 49.5 55.5 47 52 47 Z" fill="#2A2224" />
          <circle cx="50" cy="49" r="1" fill="#fff" stroke="none" opacity="0.6" />
          <path d="M52 55.5 v3" strokeWidth="1.3" />

          {pant && <path d="M49 60 C49 66 55 66 55 60 Z" fill="#E88A96" strokeWidth="1.1" />}
        </g>
        {holding === "ball" && <g transform="translate(52 62)"><circle r="7.5" fill="#F2C94C" strokeWidth="1.5" /><circle cx="-2.6" cy="-2.6" r="1.7" fill="#FCEBAA" stroke="none" /></g>}
        {holding === "bag" && <g transform="translate(52 70) rotate(-8)"><CatFoodBag scale={0.9} dog /></g>}
        {holding === "bone" && <g transform="translate(52 62) rotate(-14)"><Bone /></g>}
        {/* collar */}
        <path d="M37 63 C43 68 61 68 67 63" strokeWidth="3" stroke={p.collar || "#6FA2CC"} />
        <circle cx="52" cy="68.5" r="3.2" fill={C.honey} strokeWidth="1.4" />

  );
}

function Pet({ animal, size = 66, sound, facing = "left", holding = false, walking = false, action = null, flip = false, onPet, hearts = [] }) {
  const g = useRef("pt" + uid()).current;
  const p = petPalette(animal);
  const [happy, setHappy] = useState(false);
  const pet = () => {
    if (animal.kind === "cat") { if (sound && sound.purr) sound.purr(); }
    setHappy(true); setTimeout(() => setHappy(false), 1500);
    if (onPet) onPet();
  };
  const tiny = p.tiny ? 0.68 : 1;
  const w = (animal.kind === "dog" && p.long ? size * 1.2 : size) * tiny;
  return (
    <div style={{ position: "relative", width: w, flexShrink: 0, cursor: "pointer" }} onClick={pet} title={animal.name || (animal.kind === "cat" ? "Pet the cat" : "Pet the dog")}>
      {hearts.map((id) => (
        <svg key={id} className="bb-heartup" width="26" height="26" viewBox="0 0 24 24" style={{ position: "absolute", left: w * 0.42, top: -6, pointerEvents: "none" }}>
          <path d="M12 21 C4 15 2 10.5 2 7.6 C2 4 5 2.4 7.6 3.4 C9.4 4.1 11 6 12 7.6 C13 6 14.6 4.1 16.4 3.4 C19 2.4 22 4 22 7.6 C22 10.5 20 15 12 21 Z" fill={C.rose} stroke={OUT} strokeWidth="1.4" strokeLinejoin="round" />
          <path d="M6.6 7 C7.2 5.6 8.8 5.2 9.8 6" stroke="#FFF1F2" strokeWidth="1.3" strokeLinecap="round" fill="none" />
        </svg>
      ))}
      <svg viewBox={animal.kind === "dog" && p.long ? "-12 0 124 104" : "0 0 104 104"} width={w} height={size * tiny} aria-hidden="true"
        className={flip ? "bb-twirl" : action === "headbutt" ? "bb-butt" : walking ? "bb-walk" : "bb-catbob"}
        style={{ transform: facing === "right" ? "scaleX(-1)" : "none", display: "block" }}>
        {animal.kind === "dog" ? <DogSprite p={p} g={g} action={action} holding={holding} happy={happy} seed={animal.id} /> : <CatSprite p={p} g={g} action={action} holding={holding} happy={happy} seed={animal.id} />}
      </svg>
    </div>
  );
}

/* ================= THE PETS' STAGE ================= */
function PetStage({ children, sound, animals, treat, onTreat }) {
  const list = (animals && animals.length ? animals : [{ id: "a1", kind: "cat", breed: "grey-tabby", name: "" }]).slice(0, 3);
  const wrap = useRef(null);
  const [W, setW] = useState(360);
  useEffect(() => {
    const el = wrap.current; if (!el) return;
    const m = () => setW(el.clientWidth || 360);
    m(); window.addEventListener("resize", m);
    return () => window.removeEventListener("resize", m);
  }, []);
  const FR = Math.min(196, Math.floor(W * 0.5));
  const SZ = Math.max(42, Math.min(66, Math.floor((W - FR) / 2) - 8));
  const room = (W - FR) / 2;                                   // floor either side of the fridge
  const twoFit = room >= SZ * 1.7;                             // enough for two side by side?
  const slotX = {
    L1: W / 2 - FR / 2 - SZ - 2,
    L2: twoFit ? W / 2 - FR / 2 - SZ * 1.75 - 4 : W / 2 - FR / 2 - SZ * 0.55,   // beside, or tucked in against the fridge, smaller
    R1: W / 2 + FR / 2 + 2,
    R2: twoFit ? W / 2 + FR / 2 + SZ * 0.75 + 4 : W / 2 + FR / 2 - SZ * 0.45,
    B: W / 2 - SZ / 2,
  };
  const clampX = (x, w) => Math.max(2, Math.min(W - w - 2, x));

  const [st, setSt] = useState(() => list.map((a, i) => ({ id: a.id, slot: ["R1", "L1", "L2"][i] || "R2", holding: false, action: null, flip: false, hearts: [] })));
  useEffect(() => { setSt((prev) => list.map((a, i) => prev.find((x) => x.id === a.id) || { id: a.id, slot: ["R1", "L1", "L2"][i] || "R2", holding: false, action: null, flip: false, hearts: [] })); }, [list.map((a) => a.id).join()]);
  const [moving, setMoving] = useState({});
  const [ball, setBall] = useState({ state: "left", x: null });   // left | flying | gone | at
  const [bag, setBag] = useState(null);                              // { slot, dog }
  const busy = useRef(false);
  const timers = useRef([]);
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.current.push(t); };
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const patch = (id, fn) => setSt((prev) => prev.map((x) => (x.id === id ? { ...x, ...(typeof fn === "function" ? fn(x) : fn) } : x)));
  const go = (id, slot) => { patch(id, { slot }); setMoving((m) => ({ ...m, [id]: true })); later(() => setMoving((m) => ({ ...m, [id]: false })), 1400); };
  const act = (id, action, ms) => { patch(id, { action }); later(() => patch(id, (x) => (x.action === action ? { action: null } : {})), ms); };
  const heart = (id) => { const h = uid(); patch(id, (x) => ({ hearts: [...x.hearts, h] })); later(() => patch(id, (x) => ({ hearts: x.hearts.filter((k) => k !== h) })), 1800); };
  const sideOf = (slot) => (slot[0] === "L" ? "L" : slot[0] === "R" ? "R" : "B");
  const freeSlot = (side, taken) => (!taken.includes(side + "1") ? side + "1" : !taken.includes(side + "2") ? side + "2" : side + "1");
  const kindOf = (id) => list.find((a) => a.id === id)?.kind;

  /* idle life: wander, wash, pant, and the odd interaction */
  const selfPlay = (dogsNow) => {
    // a dog gets bored and knocks the ball across the floor and back
    if (busy.current || ball.state !== "left" || !dogsNow.length) return;
    busy.current = true;
    const d = dogsNow[Math.floor(Math.random() * dogsNow.length)];
    const home = d.slot;
    later(() => go(d.id, "L1"), 0);
    later(() => { act(d.id, "wag", 1200); setBall({ state: "at", x: "R" }); }, 1500);
    later(() => go(d.id, "R1"), 1700);
    later(() => { act(d.id, "wag", 1200); setBall({ state: "rolling" }); }, 3300);
    later(() => go(d.id, home), 3600);
    later(() => { setBall({ state: "left" }); busy.current = false; }, 5400);
  };
  useEffect(() => {
    let alive = true;
    const loop = () => later(() => {
      if (!alive) return;
      if (!busy.current) {
        setSt((cur) => {
          const cats = cur.filter((x) => kindOf(x.id) === "cat"), dogs = cur.filter((x) => kindOf(x.id) === "dog");
          const r = Math.random();
          if (dogs.length && cats.length && cur.length === 2 && r < 0.45) {
            // just the two of them: settle side by side, and the cat washes the dog's ear
            const d = dogs[0], c = cats[0];
            busy.current = true;
            if (sideOf(d.slot) !== sideOf(c.slot)) later(() => go(c.id, sideOf(d.slot) === "L" ? "L2" : "R2"), 0);
            later(() => { act(c.id, "groom", 2400); heart(d.id); act(d.id, "pant", 2400); }, 1700);
            later(() => { busy.current = false; }, 4400);
          } else if (dogs.length && r < 0.6 && ball.state === "left") {
            selfPlay(dogs);
          } else if (cats.length >= 2 && r < 0.75) {
            const [a, b] = cats;
            const same = sideOf(a.slot) === sideOf(b.slot) && sideOf(a.slot) !== "B";
            busy.current = true;
            if (!same) { later(() => go(a.id, freeSlot(sideOf(b.slot), cur.filter((x) => x.id !== a.id).map((x) => x.slot))), 0); }
            later(() => { act(a.id, Math.random() < 0.5 ? "headbutt" : "groom", 1400); heart(a.id); heart(b.id); if (Math.random() < 0.5) act(b.id, "groom", 1400); }, same ? 100 : 1600);
            later(() => { busy.current = false; }, 3400);
          } else if (dogs.length && cats.length && r < 0.6) {
            const d = dogs[0], c = cats[0];
            if (sideOf(d.slot) !== sideOf(c.slot)) { busy.current = true; later(() => go(d.id, freeSlot(sideOf(c.slot), cur.filter((x) => x.id !== d.id).map((x) => x.slot))), 0); later(() => { act(d.id, "pant", 2200); busy.current = false; }, 1600); }
          } else if (r < 0.8 && cur.length) {
            const a = cur[Math.floor(Math.random() * cur.length)];
            act(a.id, kindOf(a.id) === "cat" ? "lick" : "pant", 2400);
          } else if (cur.length) {
            const a = cur[Math.floor(Math.random() * cur.length)];
            const other = sideOf(a.slot) === "L" ? "R" : "L";
            busy.current = true;
            later(() => go(a.id, "B"), 0);
            later(() => go(a.id, freeSlot(other, cur.filter((x) => x.id !== a.id).map((x) => x.slot))), 1500);
            later(() => { busy.current = false; }, 3000);
          }
          return cur;
        });
      }
      loop();
    }, 11000 + Math.random() * 9000);
    loop();
    return () => { alive = false; };
  }, [list.map((a) => a.id).join()]);

  /* the ball */
  const throwBall = () => {
    if (busy.current || ball.state !== "left") return;
    busy.current = true;
    const dogs = st.filter((x) => kindOf(x.id) === "dog");
    const fetchers = dogs.length ? dogs : [st[0]];
    const homes = Object.fromEntries(st.map((x) => [x.id, x.slot]));
    setBall({ state: "flying" });
    later(() => setBall({ state: "gone" }), 650);
    later(() => fetchers.forEach((f) => go(f.id, "B")), 350);
    if (dogs.length >= 2) {
      const [d1, d2] = dogs;
      later(() => { go(d1.id, "R1"); go(d2.id, "L1"); patch(d1.id, { holding: "ball" }); }, 1900);
      later(() => { patch(d1.id, { holding: false }); setBall({ state: "at", x: "R" }); act(d1.id, "wag", 1200); }, 3400);
      [0, 1, 2].forEach((i) => {
        later(() => { setBall({ state: "at", x: i % 2 === 0 ? "L" : "R" }); act(i % 2 === 0 ? d2.id : d1.id, "wag", 1200); if (sound && sound.bark) sound.bark(); }, 4200 + i * 1600);
      });
      later(() => { setBall({ state: "left" }); go(d1.id, homes[d1.id]); go(d2.id, homes[d2.id]); }, 4200 + 3 * 1600 + 900);
      later(() => { busy.current = false; }, 4200 + 3 * 1600 + 2500);
    } else {
      const f = fetchers[0];
      later(() => { patch(f.id, { holding: "ball" }); go(f.id, "R1"); }, 1900);
      later(() => { patch(f.id, { holding: false }); setBall({ state: "at", x: "R" }); }, 3400);
      later(() => setBall({ state: "rolling" }), 4100);
      later(() => go(f.id, homes[f.id] === "R1" ? "R1" : "B"), 4300);
      later(() => { if (homes[f.id] !== "R1") go(f.id, homes[f.id]); }, 5600);
      later(() => { setBall({ state: "left" }); busy.current = false; }, 6400);
    }
  };

  /* thank-you for food (a bag, carried off) */
  const thank = (id) => {
    if (busy.current) return;
    busy.current = true;
    const a = list.find((x) => x.id === id); const dog = a.kind === "dog";
    const home = st.find((x) => x.id === id)?.slot || "R1";
    if (dog) { act(id, "wag", 1600); act(id, "pant", 2400); later(() => sound && sound.bark && sound.bark(), 250); }
    else { patch(id, { flip: true }); later(() => patch(id, { flip: false }), 950); later(() => sound && sound.meow && sound.meow(), 900); }
    later(() => setBag({ slot: home, dog }), 1400);
    later(() => { setBag(null); patch(id, { holding: "bag" }); }, 2200);
    later(() => go(id, "B"), 2700);
    later(() => { patch(id, { holding: false }); go(id, home); }, 4200);
    later(() => { busy.current = false; }, 5700);
  };
  /* a bone-shaped cookie for a dog: eaten on the spot, a heart, one sweet bark */
  const cookie = (id) => {
    if (busy.current) return;
    busy.current = true;
    patch(id, { holding: "bone" });
    act(id, "wag", 900);
    later(() => act(id, "chomp", 1500), 700);
    later(() => { patch(id, { holding: false }); heart(id); }, 2200);
    later(() => sound && sound.bark && sound.bark(), 2500);
    later(() => { act(id, "pant", 1800); busy.current = false; }, 2700);
  };
  const owesCookie = (a) => !!(treat && treat.dogTreats && (treat.dogTreats.includes("*") || treat.dogTreats.some((n) => n && a.name && n.toLowerCase() === a.name.toLowerCase())));
  const onPetAnimal = (a) => {
    heart(a.id);
    if (a.kind === "cat" && treat && treat.cat) { thank(a.id); onTreat && onTreat("cat"); return; }
    if (a.kind === "dog" && owesCookie(a)) { cookie(a.id); onTreat && onTreat("cookie", a.name); return; }
    if (a.kind === "dog" && treat && treat.dog) { thank(a.id); onTreat && onTreat("dog"); return; }
  };

  const ballX = ball.state === "flying" ? W / 2 - 11 : ball.x === "R" ? clampX(slotX.R1 + SZ + 2, 22) : clampX(slotX.L1 - 14, 22);
  const ballBehind = ball.state === "flying" || ball.state === "rolling";
  const H = SZ + 262 * (FR / 196);

  return (
    <div ref={wrap} style={{ position: "relative", padding: "10px 0 6px", overflow: "hidden" }}>
      <div style={{ position: "relative", zIndex: 2, width: "100%", maxWidth: FR, margin: "0 auto" }}>{children}</div>

      {st.map((x) => {
        const a = list.find((k) => k.id === x.id); if (!a) return null;
        const back = x.slot.endsWith("2") && !twoFit;
        const w = a.kind === "dog" && (DOG_BREEDS[a.breed] || {}).long ? SZ * 1.2 : SZ;
        const left = x.slot === "B" ? slotX.B : clampX(slotX[x.slot], w);
        return (
          <div key={x.id} style={{
            position: "absolute", bottom: back ? 14 : 6, left, width: w,
            zIndex: x.slot === "B" ? 1 : back ? 3 : 4, opacity: x.slot === "B" ? 0 : 1,
            transform: back ? "scale(.72)" : "none", transformOrigin: "center bottom",
            transition: "left 1.35s cubic-bezier(.45,.05,.4,1), opacity .45s ease, transform .6s ease",
            transitionDelay: x.slot === "B" ? "0s, .7s, 0s" : "0s, 0s, 0s",
          }}>
            <Pet animal={a} size={SZ} sound={sound} facing={x.slot[0] === "R" ? "right" : "left"} holding={x.holding} walking={!!moving[x.id]} action={x.action} flip={x.flip} hearts={x.hearts} onPet={() => onPetAnimal(a)} />
          </div>
        );
      })}

      {bag && (
        <div className="bb-rise" style={{ position: "absolute", bottom: 8, zIndex: 5, left: clampX(bag.slot[0] === "L" ? slotX.L1 - 26 : slotX.R1 + SZ + 2, 22) }}>
          <svg viewBox="-12 -18 24 34" width="22" height="31" aria-hidden="true"><CatFoodBag dog={bag.dog} /></svg>
        </div>
      )}

      {ball.state !== "gone" && (
        <button onClick={throwBall} aria-label="Throw the ball" disabled={ball.state !== "left"} style={{
          position: "absolute", left: ballX, bottom: ball.state === "flying" ? Math.round(H * 0.5) : 10, zIndex: ballBehind ? 1 : 5,
          background: "none", border: "none", padding: 0, cursor: ball.state === "left" ? "pointer" : "default",
          transform: ball.state === "flying" ? "scale(.55)" : "scale(1)",
          transition: ball.state === "rolling" ? "left 1.9s cubic-bezier(.3,.2,.4,1)" : ball.state === "at" ? "left 1.2s cubic-bezier(.35,.1,.4,1)" : "left .65s cubic-bezier(.3,.6,.5,1), bottom .65s cubic-bezier(.2,-.4,.7,1), transform .65s ease",
        }}>
          <span className={ball.state === "flying" || ball.state === "rolling" || ball.state === "at" ? "bb-spin" : ""} style={{ display: "block" }}><Ball size={22} /></span>
        </button>
      )}
    </div>
  );
}

function Panel({ children, style, ornate, accent }) {

  return (
    <div style={{ position: "relative", background: th ? mix(th.paper, "#FFFFFF", 0.4) : C.parch, border: `1px solid ${th ? mix(th.accent, "#FFFFFF", 0.55) : C.line}`, borderRadius: 4, padding: 6, boxShadow: "0 14px 36px rgba(70,48,42,0.12)", ...style }}>

        {ornate && <><Corner style={{ top: 4, left: 4 }} /><Corner style={{ top: 4, right: 4, transform: "scaleX(-1)" }} /><Corner style={{ bottom: 4, left: 4, transform: "scaleY(-1)" }} /><Corner style={{ bottom: 4, right: 4, transform: "scale(-1)" }} /></>}

}
const Divider = ({ w = 54 }) => {
  const th = React.useContext(ThemeCtx);
  const col = th ? th.accent : C.gold, ln = th ? mix(th.accent, "#FFFFFF", 0.55) : C.line;
  return (

/* ================= APP ================= */
function App() {
  const [data, setData] = useState(null);
  const [who, setWho] = useState(null);
  const timer = useRef(null);
  const whoRef = useRef(null); whoRef.current = who;
  const dataRef = useRef(null); dataRef.current = data;
  const sound = useChime();
  const [demo, setDemo] = useState(false);
  const names = demo ? { mayu: "Host", bran: "Home", title: "Bistro 309 · Demo" } : { mayu: "Mayu", bran: "Bran", title: "Bistro 309" };
  const toggleDemo = async (on) => { DEMO = on; setDemo(on); setWho(null); setData(null); setData((await readRemote()) || seed()); };

  const normalise = (d) => {
    const base = seed();
    return d ? {
      ...base, ...d,
      grocery: (d.grocery || []).map((x) => ({ ...x, got: x.got === true ? "mayu" : x.got === false ? null : x.got })),
      menuNote: d.menuNote || "", event: d.event || base.event, guestOrdering: d.guestOrdering !== false,
      passwords: { ...base.passwords, ...(d.passwords || {}) }, animals: d.animals && d.animals.length ? d.animals : base.animals,
      sketchMayu: d.sketchMayu || (d.sketch && d.sketch.from === "mayu" ? d.sketch : null), sketchBran: d.sketchBran || (d.sketch && d.sketch.from === "bran" ? d.sketch : null),
      wheel: d.wheel || [],
      recipes: [...(d.recipes || []), ...base.recipes.filter((r) => !(d.recipes || []).some((x) => x.id === r.id) && !(d.deleted || []).includes(r.id))],
    } : base;
  };
  const readRemote = async () => { const raw = await store.get(); try { return raw ? normalise(JSON.parse(raw)) : null; } catch { return null; } };

  useEffect(() => { (async () => { setData((await readRemote()) || seed()); })(); }, []);

  /* everyone polls; whatever arrives is folded in rather than pasted over */
  useEffect(() => {
    let alive = true;
    const iv = setInterval(async () => {
      const remote = await readRemote(); if (!alive || !remote || !dataRef.current) return;
      setData((p) => mergeData(p, remote, whoRef.current || "bran"));
    }, 3000);
    return () => { alive = false; clearInterval(iv); };
  }, []);

  /* writes merge with the latest remote first so nobody's order gets overwritten */
  const flushing = useRef(false);
  const flush = async () => {
    if (flushing.current) { clearTimeout(timer.current); timer.current = setTimeout(flush, 500); return; }
    flushing.current = true;
    try {
      const who = whoRef.current || "bran";
      const remote = await readRemote();
      if (store.synced() && !remote && SYNC.getOk === false) {   // couldn't read the shared kitchen: wait and retry rather than overwrite it blind
        clearTimeout(timer.current); timer.current = setTimeout(flush, 3000); return;
      }
      const merged = remote ? mergeData(dataRef.current, remote, who) : dataRef.current;
      dataRef.current = merged; setData(merged);
      const body = JSON.stringify(merged);
      const ok = await store.set(body);
      if (!ok) { if (store.synced()) { clearTimeout(timer.current); timer.current = setTimeout(flush, 3000); } return; }
      if (store.synced()) {
        /* read it straight back: if what we just wrote isn't there, something between us and the record is dropping saves */
        const check = await readRemote();
        const mine = (merged.requests || []).map((r) => r.id);
        const theirs = new Set(((check && check.requests) || []).map((r) => r.id));
        if (check && mine.some((id) => !theirs.has(id))) { SYNC.error = "A save didn't stick — retrying."; clearTimeout(timer.current); timer.current = setTimeout(flush, 2500); }
      }
    } finally { flushing.current = false; }
  };
  const update = (fn) => setData((prev) => {
    const next = typeof fn === "function" ? fn(prev) : fn;
    dataRef.current = next;
    clearTimeout(timer.current);
    timer.current = setTimeout(flush, 350);
    return next;
  });

  return (
    <NameCtx.Provider value={names}>
      <style>{CSS}</style>
      <Backdrop />
      <div style={{ position: "relative", zIndex: 1, minHeight: "100vh", padding: "18px 14px 44px", fontFamily: F, color: C.ink, fontSize: 17, lineHeight: 1.5 }}>
        {!who && data && (
          <button onClick={() => toggleDemo(!demo)} style={{ position: "absolute", top: 12, left: 12, font: `500 14px ${F}`, letterSpacing: "0.08em", color: demo ? "#fff" : C.soft, background: demo ? C.sageDeep : C.parch, border: `1px solid ${demo ? C.sageDeep : C.line}`, borderRadius: 999, padding: "5px 12px", cursor: "pointer" }}>
            {demo ? "leave demo" : "demo"}
          </button>
        )}
        <div style={{ maxWidth: 560, margin: "0 auto" }}>
          {!data && <Panel><Sub>Warming the kitchen…</Sub></Panel>}
          {data && !who && <Gate data={data} onIn={(w) => { sound.unlock(); setWho(w); }} reload={async () => { const r = await readRemote(); setData(r || seed()); }} />}
          {data && who === "mayu" && <Cook data={data} update={update} setData={setData} out={() => { store.logout(); setWho(null); }} sound={sound} />}
          {data && (who === "bran" || who === "guest") && <Diner data={data} update={update} out={() => { store.logout(); setWho(null); }} mode={who} sound={sound} />}
        </div>
      </div>
    </NameCtx.Provider>
  );
}

function KitchenCode({ data, reload }) {
  const [open, setOpen] = useState(false);
  const [code, setCode] = useState(getKitchenCode());

  const [msg, setMsg] = useState("");

  if (DEMO) return null;
  const save = async () => { setKitchenCode(code); setMsg(""); await reload(); setOpen(false); };
  const create = async () => {
    setBusy(true); setMsg("");
    try { const id = await createKitchenCode(data); setKitchenCode(id); setCode(id); await reload(); setMsg("Created. Copy the code and enter it on the other phones."); }
    catch { setMsg("Couldn't reach the code service just now. Try again, or paste a Firebase database URL instead."); }
    setBusy(false);
  };
  return (
    <div style={{ textAlign: "center", marginTop: 14 }}>
      <button onClick={() => setOpen(!open)} style={{ font: `italic 15px ${F}`, color: live ? C.sageDeep : C.soft, background: "none", border: "none", cursor: "pointer", textDecoration: "underline dotted" }}>
        {SYNC_URL ? "Connected" : live ? (SYNC.error ? "Connection problem — tap" : "Connected") : "Connect with a code"}

          <div style={{ display: "flex", gap: 8 }}>

            <Btn small onClick={save} disabled={!code.trim()}>Use</Btn>

            <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
              <Btn small tone="ghost" onClick={() => { navigator.clipboard?.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 1500); }}>{copied ? "Copied" : "Copy"}</Btn>

function Gate({ data, onIn, reload }) {
  const [name, setName] = useState("mayu");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  /* clear the field the moment the page is backgrounded or loses focus */
  useEffect(() => {
    const wipe = () => setPw("");
    const onVis = () => { if (document.hidden) wipe(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("blur", wipe);
    window.addEventListener("pagehide", wipe);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("blur", wipe); window.removeEventListener("pagehide", wipe); };
  }, []);
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true);
    const server = await store.login(name, pw);
    setBusy(false);
    if (server === true) return onIn(name);
    if (server === null && pw === data.passwords[name]) return onIn(name);
    setErr("That password doesn't open this door.");
  };
  return (
    <div className="bb-rise">
      <div style={{ textAlign: "center", marginBottom: 6 }}><ChefBunny size={168} /></div>
      <Panel ornate>
        <Title size={36}>{useNames().title}</Title>
        <Divider />
        <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap", margin: "6px 0 16px" }}>
          {[["mayu", useNames().mayu], ["bran", useNames().bran], ["guest", "Guest"]].map(([k, l]) => <Chip key={k} active={name === k} onClick={() => { setName(k); setErr(""); }}>{l}</Chip>)}
        </div>
        <div style={{ maxWidth: 300, margin: "0 auto", display: "grid", gap: 10 }}>
          <Field type="password" inputMode="text" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
            placeholder="Password" value={pw}
            onChange={(e) => { setPw(e.target.value); setErr(""); }}
            onKeyDown={(e) => e.key === "Enter" && go()}
            style={{ WebkitTextSecurity: "disc", textSecurity: "disc" }} />
          <Btn onClick={go} disabled={busy}>{busy ? "Checking…" : "Log in"}</Btn>
          {err && <div style={{ font: `16px ${F}`, color: C.tomato, textAlign: "center" }}>{err}</div>}
        </div>
      </Panel>
      <KitchenCode data={data} reload={reload} />
    </div>
  );
}

function SyncCheck() {

function Cook({ data, update, setData, out, sound }) {

  const seenCravings = useRef(new Set(data.cravings.map((c) => c.id)));
  const openCount = data.requests.filter((r) => !r.done).length + data.cravings.filter((c) => !c.done).length;

  /* the cook's phone: anything new that arrives in the shared data rings once */
  useEffect(() => {
    const fresh = (data.requests || []).filter((r) => !seen.current.has(r.id) && r.from !== "mayu");
    const freshCr = (data.cravings || []).filter((c) => !seenCravings.current.has(c.id));
    if (!fresh.length && !freshCr.length) return;
    fresh.forEach((r) => seen.current.add(r.id)); freshCr.forEach((c) => seenCravings.current.add(c.id));
    const first = fresh[0];
    const label = first ? (first.recipeId ? data.recipes.find((x) => x.id === first.recipeId)?.name : data.drinks.find((x) => x.id === first.drinkId)?.name) : `Craving: ${freshCr[0].text}`;
    setNote({ who: first ? (first.from === "guest" ? `Guest${first.guestName ? " · " + first.guestName : ""}` : names.bran) : names.bran, body: fresh.length > 1 ? `${label} and ${fresh.length - 1} more` : label, when: first?.whenLabel || "" });
    sound.ping();
    const t = setTimeout(() => setNote(null), 5400);
    return () => clearTimeout(t);
  }, [data.requests, data.cravings]);

  const titles = { freezer: "Freezer", fridge: "Fridge, Pantry & Snacks", orders: "Orders", recipes: "Recipe Book", cellar: "Cellar & Bar", week: "This Week", grocery: "Grocery List", guest: "Guest Menu, Events & Passwords", season: "In Season", pets: "Pets", sketch: "Fridge Drawing" };
